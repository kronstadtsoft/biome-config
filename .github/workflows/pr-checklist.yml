name: PR checklist

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

concurrency:
  group: pr-checklist-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checklist:
    name: pr-checklist
    # The Default runner group refuses public repositories; GitHub-hosted minutes are free for them.
    runs-on: ${{ github.event.repository.private && 'small' || 'ubuntu-latest' }}
    timeout-minutes: 3
    steps:
      - uses: kronstadtsoft/internal/qms/actions/pr-checklist@main
