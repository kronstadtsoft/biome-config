name: PR checklist

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

concurrency:
  group: pr-checklist-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checklist:
    name: pr-checklist
    # A public repository cannot use the action in the private internal repository (kfi-workflow).
    if: github.event.repository.private
    runs-on: [hl-small]
    timeout-minutes: 3
    steps:
      - uses: kronstadtsoft/internal/qms/actions/pr-checklist@main
